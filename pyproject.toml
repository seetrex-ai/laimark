[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laimark"
version = "0.1.0"
description = "Self-generated curricula for RLVR on language models"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Jesús Tabares Montilla", email = "jesus@tabares.eu" },
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "trl>=0.9",
    "peft>=0.10",
    "datasets>=2.18",
    "accelerate>=0.28",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
]

[project.urls]
Paper = "https://github.com/seetrex-ai/laimark/blob/main/paper/laimark.tex"
Issues = "https://github.com/seetrex-ai/laimark/issues"

[tool.setuptools.packages.find]
include = ["laimark*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E741"]
