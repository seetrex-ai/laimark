[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laimark"
version = "0.1.0"
description = "Self-generated curricula for reinforcement learning from verifiable reward (RLVR) on language models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Jesús Tabares Montilla", email = "jesus@tabares.eu" },
]
keywords = [
    "reinforcement learning",
    "RLVR",
    "GRPO",
    "self-generated curriculum",
    "language models",
    "self-evolution",
    "Qwen3",
    "LoRA",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1,<3.0",
    "transformers>=4.40,<5.0",
    "trl>=0.9,<2.0",
    "peft>=0.10,<1.0",
    "datasets>=2.18,<4.0",
    "accelerate>=0.28,<2.0",
    "requests>=2.28,<3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/seetrex-ai/laimark"
Repository = "https://github.com/seetrex-ai/laimark"
Paper = "https://github.com/seetrex-ai/laimark/blob/main/paper/Laimark.pdf"
Issues = "https://github.com/seetrex-ai/laimark/issues"
Release = "https://github.com/seetrex-ai/laimark/releases"

[tool.setuptools.packages.find]
include = ["laimark*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E741"]
